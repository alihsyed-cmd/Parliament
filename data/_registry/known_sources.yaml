  url: https://geohub-gnl.hub.arcgis.com/datasets/municipal-boundaries
  authority: Government of Newfoundland and Labrador — GeoHub (GNL GeoAtlas)
  format: geojson
  notes: 'VECTOR available. Corner Brook is AT-LARGE (Mayor + 6 councillors elected town-wide, no geographic
    wards — City of Corner Brook Act / "open ward" municipal model), so the single Town/City of Corner
    Brook municipal-boundary polygon is the lone electoral area (Vancouver/Victoria at-large precedent).
    Machine-readable vector geometry IS obtainable: the official GNL GeoAtlas ArcGIS service exposes "Municipal
    Boundaries" as layer id 7 (esriGeometryPolygon) at https://dnrmaps.gov.nl.ca/arcgis/rest/services/GeoAtlas/Land_Use/MapServer/7
    — confirmed queryable with supportedQueryFormats including JSON and geoJSON. Surfaced on the official
    GNL ArcGIS Hub ("Municipal Boundaries, Newfoundland and Labrador", ArcGIS item c1e4bbde3ea743a488ce23cccedce08f)
    and also in the NL Open Data portal as the "Municipalities and Local Service Districts" dataset (Economics
