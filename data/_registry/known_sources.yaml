- slug: ca_on_toronto
  source_type: candidates
  url: "https://www.toronto.ca/data/elections/candidate_list/mayorCandidates_2026.json"
  authority: "City of Toronto, Office of the City Clerk"
  format: "json"
  covers: ['mayor']
  notes: "JSON data endpoint underlying the JS-rendered page https://www.toronto.ca/city-government/elections/candidate-list/ (an empty shell to plain curl/WebFetch). Endpoint resolved by fetching the page's main1.1.4.js bundle, which builds candidate data URLs via candidateList(t) = DATA_FOLDER + \"/\" + t, DATA_FOLDER = https://www.toronto.ca/data/elections/candidate_list. All 42 entries have status \"Active\"; the site keeps withdrawn candidates in a separate feed (see withdrawn entry below), so this file already excludes withdrawals. Root JSON object has keys seq, spaces, candidates (array).
"
  last_confirmed: 2026-08-17

- slug: ca_on_toronto
  source_type: candidates
  url: "https://www.toronto.ca/data/elections/candidate_list/councilorCandidates_2026.json"
  authority: "City of Toronto, Office of the City Clerk"
  format: "json"
  covers: ['councillor']
  notes: "Same discovery method and endpoint family as the mayor artifact above. Root JSON object has keys seq, spaces, ward (array of 25 ward objects, each with name/num and a candidate array). Ward \"num\" is a plain integer string (e.g. \"1\"..\"25\") matching City Council ward numbering. All 148 entries have status \"Active\" (withdrawals excluded already; see below).
"
  last_confirmed: 2026-08-17


- slug: ca_on_london
  source_type: candidates
  url: "https://london.ca/government/council-civic-administration/elections/list-candidates"
  authority: "City of London, Office of the City Clerk"
  format: "html"
  covers: ['mayor', 'councillor', 'school_board_trustee']
  notes: "Official \"List of Candidates\" page on london.ca. Structured as nested <details> sections: Mayor, City Council (with sub-sections Ward 1 through Ward 14, one section per ward, no multi-ward council races), and School Board Trustees (with multi-ward trustee zones, out of scope for this pipeline). Each candidate entry lists name (bold), and where provided, Qualifying Address, Phone, Email, and Website. Page states it is \"updated each business day by 4:30 p.m.\" and that the certified list under s.35(1)(2) of the Municipal Elections Act will be posted only after City Clerk certification (before 4:00 p.m. on 2026-08-24). Nominations close 2:00 p.m. 2026-08-21. As of today (2026-08-17), this is the rolling registered/nomination-register list, not yet certified. Plain curl returns the full server-rendered HTML with all candidate data present (confirmed via direct fetch) — not a JS shell, so no headless-Chrome fallback needed. A downloadable PDF \"2026 Nomination candidate register\" (dated 2026-08-14) is also linked from the page, but the HTML page itself carries the same (or more current) data in a parseable structured form, so the PDF is not needed and is out of scope per policy regardless."
  last_confirmed: 2026-08-17

- slug: ca_on_mississauga
  source_type: candidates
  url: "https://ovs.voterview.ca/candidateList/candidatedetails?filter=&countyMun=2105&schoolcode="
  authority: "City of Mississauga, Office of the City Clerk (Elections) — data served via the VoterView/DFX election services platform under contract to the City, embedded directly on the City's official mississaugavotes.ca elections microsite."
  format: "html"
  covers: ['mayor', 'councillor']
  notes: "The human-facing page https://mississaugavotes.ca/2026-municipal-election/for-voters/whos-running/ is a JS shell that only statically lists withdrawn candidates; the live candidate roster is loaded client-side via an iframe (https://ovs.voterview.ca/candidatelist/2105) which in turn AJAX-fetches this HTML fragment endpoint. This endpoint is the resolved data source. It returns 100 total candidate cards across Mayor (10), Councillor Ward 1-11 (60), and school-board Trustee races (30, out of scope). All 11 wards have at least one councillor candidate. The endpoint reflects only currently-registered candidates — cross-checked against the site's static withdrawn-candidates table (6 names: George Tavares, Rahul Mehta, Charles Corey, Syed Jaffrey, Olivia Gannon, Zulfiqar Ali, all recorded as withdrawn from specific races); of these, Syed Jaffrey does not appear anywhere in this endpoint (fully withdrawn), while the other five appear registered under a *different* office than the one they withdrew from (e.g. Rahul Mehta withdrew from Mayor, now shows as Councillor Ward 8) — i.e. they re-registered for a different race rather than leaving the election, so their current entries are legitimately active and should not be excluded."
  last_confirmed: 2026-08-17

- slug: ca_on_markham
  source_type: candidates
  url: "https://www.markham.ca/elections/candidates-and-third-party-advertisers/whos-running"
  authority: "City of Markham (Office of the City Clerk)"
  format: "html"
  covers: ['mayor', 'regional_councillor', 'councillor']
  notes: "Official \"Who's Running\" candidates page on markham.ca. Plain curl (no JS rendering needed) returns full HTML with real candidate names and contact details embedded in the markup — confirmed by grepping for \"Martin Ross\" and his email in the raw curl output. Page states \"The list of registered candidates will be posted to this page once available\" — nomination period is open until 2026-08-21, so this is a rolling REGISTERED list, not yet certified. Contains 1 Mayor, 7 Regional Councillor candidates (at-large), 24 Ward Councillor candidates across all 8 wards, and 14 School Board Trustee candidates (York Region, York Catholic, Viamonde/MonAvenir — out of scope for this pipeline, mayor/council only). A duplicate mirror of the same content exists at electionsmarkham.ca (electionsmarkham.ca/en/candidates/who-s-running/ and /candidate-list/) — markham.ca chosen as the primary record since it verified cleanly via plain curl; both are official City of Markham domains."
  last_confirmed: 2026-08-17

