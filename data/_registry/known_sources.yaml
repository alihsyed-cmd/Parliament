  format: geojson
  notes: 'BOUNDARIES FORMAT VERDICT: VECTOR available (NOT PDF-only). The City of Moncton operates
  its own official ArcGIS Hub open data portal (open.moncton.ca) and publishes a "Wards"
  dataset of ward boundary polygons. Moncton is WARD-BASED: 4 wards (residents in
  each ward elect 2 ward councillors), plus 2 councillors-at-large and a Mayor elected
  city-wide. ArcGIS Hub feature datasets export as GeoJSON, shapefile, and KML; acquisition
  stage should select GeoJSON for the 4 ward polygons. Dataset item id 75c6b0995e634169b1418790c79224f4_0
  (open.moncton.ca/datasets/75c6b0995e634169b1418790c79224f4_0/about). A separate
  "Municipal Boundary" polygon dataset (open.moncton.ca/datasets/0ab93f0336c7483e8975faa4fb8eb441_0/about)
  and a "Moncton Street and Ward Map" also exist on the same portal. The portal is
  JS-rendered and returns thin content on automated fetch (only the "Wards" heading
  surfaces), but the dataset''s existence, ward-polygon content, and official City
  of Moncton provenance are confirmed via the portal search index. The provincial
  GeoNB / Service New Brunswick catalogue is the NB vector authority for PROVINCIAL
  electoral districts but does not publish Moncton municipal ward polygons; the city
  open data portal is the correct authoritative source for municipal wards. NB 2023
  local-governance reform note: Moncton was a pre-existing city largely unaffected
  structurally by the 2023 amalgamation (which targeted rural/small entities); it
  retains the 4-ward model.'
