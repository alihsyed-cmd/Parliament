- slug: ca_qc_sherbrooke
  source_type: cabinet
  url: https://www.sherbrooke.ca/fr/vie-municipale/structure-organisationnelle
  authority: Ville de Sherbrooke
  format: html
  notes: 'Applies for Sherbrooke: like other large Quebec cities (cf. Québec City pattern), Sherbrooke
    has a comité exécutif (executive committee) — the municipal analog of a cabinet. Presided by Mairesse
    Marie-Claude Bibeau, with Geneviève La Roche (councillor, Ascot) as vice-president and additional
    councillor members (e.g. Annie Faucher, Laure Letarte-Lavoie, Karine Godbout, Pierre Avard). The official
    "Structure organisationnelle" page documents the governance bodies; current comité exécutif membership
    is also announced via official sherbrooke.ca press releases (e.g. /fr/vie-municipale/actualites/communiques-de-presse).
    Roles such as maire suppléant (alternate mayor) and président(e) du conseil also exist. Extraction
    should resolve current comité exécutif roster from these official pages.'
  last_confirmed: '2026-06-20'
