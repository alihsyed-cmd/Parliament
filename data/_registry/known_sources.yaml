- slug: ca_on_whitby
  source_type: candidates
  url: "https://planyourvote.voterview.ca/api/service?route=candidate_list%3Fward%3D%26schoolSupportCode%3D%26nominationDateFrom%3D2026-01-01%26nominationDateTo%3D2026-12-31"
  authority: "Town of Whitby, Office of the Town Clerk (via Voterview \"Plan Your Vote\" platform)"
  format: "json"
  covers: ['mayor', 'councillor', 'regional_councillor', 'trustee']
  notes: "The public-facing page https://www.whitby.ca/town-hall/municipal-elections/candidates/ is procedural only (how to become a candidate) and contains no roster. That page links to \"Who is Running?\" -> https://planyourvote.voterview.ca/candidate-list, a JS-rendered Angular SPA (Voterview \"Plan Your Vote\" tool) that renders nothing without executing JS. Network inspection (Chrome headless NetLog) revealed the underlying data endpoint recorded as `url` above, which returns a JSON payload (a JSON string containing escaped JSON — must be json.loads() twice) with a `Positions` array. Each position has `BallotDescription` (office) and a `Candidates` array with name, email (EmailAddress/PublicEmail), phone (Telephone/CellPhone/HomeTelephone/PublicPhone), and ward fields (WardName/Wards). 13 positions total: Mayor (3), Town Councillor x4 wards (3+6+6+4=19), Regional Councillor x4 wards (4+2+2+2=10) — 32 mayor/council candidates — plus 4 school-board trustee positions (7 candidates: DDSB 4, DCDSB 2, Conseil scolaire Viamonde 0, Conseil scolaire catholique MonAvenir 1) which are out of scope for this pipeline. Ward numbers in BallotDescription (Ward 1-4) correspond to North/West/Centre/East per the boundary file (WARD column). No candidate appeared in more than one position (checked by CandidateID). No withdrawal/status field exists in the schema; all candidates show EligibilityConfirmed=\"No\" (pre-certification, consistent with registered status)."
  last_confirmed: 2026-08-17

