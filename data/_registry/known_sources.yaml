    shapefile, and KML; acquisition stage should select GeoJSON for the 4 ward polygons. Dataset item
    id 75c6b0995e634169b1418790c79224f4_0 (open.moncton.ca/datasets/75c6b0995e634169b1418790c79224f4_0/about).
