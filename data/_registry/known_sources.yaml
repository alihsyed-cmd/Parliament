    thin content on automated fetch (only the "Wards" heading surfaces), but the dataset''s existence,
    ward-polygon content, and official City of Moncton provenance are confirmed via the portal search
    index. The provincial GeoNB / Service New Brunswick catalogue is the NB vector authority for PROVINCIAL
    electoral districts but does not publish Moncton municipal ward polygons; the city open data portal
    is the correct authoritative source for municipal wards. NB 2023 local-governance reform note: Moncton
    was a pre-existing city largely unaffected structurally by the 2023 amalgamation (which targeted rural/small
    entities); it retains the 4-ward model.'
