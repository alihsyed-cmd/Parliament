  source_type: boundaries
  url: https://map.stjohns.ca/mapsrv/rest/services/WardMap/MapServer
  authority: City of St. John's — Land Information Services (GIS / Map Centre)
...
  format: geojson
  notes: 'VECTOR ward geometry IS available (machine-readable, not PDF-only). The City of St.
  John''s hosts a dedicated ArcGIS REST service "WardMap/MapServer" on its own GIS
  host (map.stjohns.ca/mapsrv/rest/services). Single polygon layer 0 "WARDS_wCouncillorInfo"
  — the 5 electoral ward boundary polygons with councillor info attached. Spatial
  reference EPSG:32181 (NAD83 NL stereographic / UTM-equivalent); service supports
  query/export with output formats JSON, geoJSON, and PBF (maxRecordCount 2000). Acquisition
  stage should pull GeoJSON from the layer-0 query endpoint (.../WardMap/MapServer/0/query?where=1=1&outFields=*&f=geojson)
  and reproject/handle CRS as needed. NOTE on scope: St. John''s council is Mayor
  + Deputy Mayor + 5 ward councillors + 4 councillors-at-large; only the 5 wards are
  geographic districts, so this WardMap layer is the complete electoral-boundary set
  (the 4 at-large seats have no sub-city geometry). The city does NOT publish ward
  boundaries via an ArcGIS Hub / open-data portal — its public Maps page (stjohns.ca/en/city-hall/maps.aspx)
  offers only an interactive Map Centre viewer and PDF printable maps — but the underlying
  REST MapServer makes vector export available. The provincial portal (opendata.gov.nl.ca)
  carries only Provincial Electoral Districts, not St. John''s municipal wards.'
  last_confirmed: '2026-06-12'
