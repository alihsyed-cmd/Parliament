  url: https://electionsnovascotia.ca/
  authority: "Elections Nova Scotia (Office of the Chief Electoral Officer of Nova Scotia)"
  format: html
  notes: >
    Official Elections Nova Scotia site — the authority for election
    dates and provincial electoral structure. Confirms the most recent
    general election was the 66th general election, held November 26,
    2024 (early call by the Premier; 65th General Assembly). Nova
    Scotia's fixed-date election law (third Tuesday in July every 4
    years, first date would have been July 15, 2025) was REPEALED by a
    bill that received royal assent March 26, 2025, reverting to a
    maximum ~5-year cycle; the next general election must be held on or
    before December 7, 2029. 55 single-member electoral districts (House
    of Assembly Act, Bill No. 187, 2019). Distribution of seats by party
    published at
    electionsnovascotia.ca/files/DistributionOfSeatsByParty_2026_05.pdf;
    annual CEO/financial reports at
    electionsnovascotia.ca/Annual-Reports. Site partly under
    reconstruction at discovery time; homepage and file paths live.
  last_confirmed: '2026-06-06'
