- slug: ca_sk_lloydminster
  source_type: boundaries
  url: https://geohub.saskatchewan.ca/datasets
  authority: Government of Saskatchewan — GeoHub (Saskatchewan Geospatial Hub, Information Services Corporation
    data)
  format: geojson
  notes: 'BOUNDARIES FORMAT VERDICT: VECTOR available (NOT PDF-only). Lloydminster is AT-LARGE (Mayor
    + 6 councillors elected city-wide, no geographic wards), so the single City of Lloydminster municipal-boundary
    polygon is the lone electoral area (Vancouver / Victoria / Cornwall / Mount Pearl at-large precedent).
    Machine-readable vector geometry IS obtainable from the official Government of Saskatchewan GeoHub
    (geohub.saskatchewan.ca/datasets), which explicitly offers CSV, KML, Zip, GeoJSON, GeoTIFF and PNG
    downloads. The relevant dataset is the province''s "Urban Municipality" boundary layer — polygon geometry
    (esriGeometryPolygon) with municipality name and municipal type (city/town/village) attributes — sourced
    from Information Services Corporation (ISC). Backing official ArcGIS REST feature service: https://gis.saskatchewan.ca/arcgis/rest/services/SaskatchewanJurisdictions/FeatureServer/0
    (Urban Municipality, ID 0); a companion service exists at https://gis.saskatchewan.ca/arcgis/rest/services/UrbanAreas/MapServer
    . ACQUISITION: download the Urban Municipality vector (GeoJSON via the GeoHub or the FeatureServer
    query endpoint ...FeatureServer/0/query?where=1=1&outFields=*&f=geojson) and isolate the City of Lloydminster
    polygon by municipality-name attribute. The gis.saskatchewan.ca REST host returns HTTP 403 on automated
    fetch; provenance and vector/GeoJSON availability confirmed via Saskatchewan GeoHub listings and the
    REST service metadata in search results. NOTE on the bi-provincial boundary: Lloydminster straddles
    the Alberta–Saskatchewan border; the SK provincial Urban Municipality layer is expected to carry the
    full incorporated city polygon (single council under The Lloydminster Charter). Alternative official
    vector fallbacks if the SK polygon is truncated at the provincial line: Statistics Canada 2021 Census
    Subdivision (CSD) Boundary File (Government of Canada — covers Lloydminster across both provinces,
    shapefile/GDB/GeoJSON), and the City''s own ArcGIS Enterprise portal at geo.lloydminster.ca/portal
    (City Maps), whose REST services should expose a city-boundary feature layer. Confirm full cross-border
    extent at acquisition.'
  last_confirmed: '2026-06-17'
